<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xyphers - Login</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../play/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="../auth.js"></script>
    <style>
        body {
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: var(--accent-primary);
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-main);
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(136, 192, 208, 0.1);
        }

        .toggle-text {
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .toggle-text a {
            color: var(--accent-primary);
            cursor: pointer;
            text-decoration: underline;
        }

        #error-msg {
            color: var(--accent-error);
            margin-bottom: 1rem;
            min-height: 1.2rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h1><a href="../index.html" class="home-link">
                <svg class="logo-x" viewBox="0 0 100 100">
                    <circle cx="30" cy="30" r="21" />
                    <line x1="56" y1="56" x2="90" y2="90" />
                    <line x1="90" y1="10" x2="10" y2="90" />
                </svg>YPHERS
            </a></h1>

        <div id="error-msg"></div>

        <form id="auth-form">
            <div class="input-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" id="submit-btn" class="btn primary full-width">LOG IN</button>
        </form>

        <p class="toggle-text">
            <span id="toggle-prompt">Don't have an account?</span>
            <a id="toggle-btn">Sign Up</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('auth-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submit-btn');
            const toggleBtn = document.getElementById('toggle-btn');
            const togglePrompt = document.getElementById('toggle-prompt');
            const errorMsg = document.getElementById('error-msg');

            let isLoginMode = true;

            // Check if already logged in
            if (UserSession.isLoggedIn()) {
                window.location.href = '../profile/index.html';
            }

            toggleBtn.addEventListener('click', () => {
                isLoginMode = !isLoginMode;
                if (isLoginMode) {
                    submitBtn.textContent = 'LOG IN';
                    togglePrompt.textContent = "Don't have an account?";
                    toggleBtn.textContent = 'Sign Up';
                } else {
                    submitBtn.textContent = 'SIGN UP';
                    togglePrompt.textContent = "Already have an account?";
                    toggleBtn.textContent = 'Log In';
                }
                errorMsg.textContent = '';
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    errorMsg.textContent = 'Please fill in all fields';
                    return;
                }

                if (isLoginMode) {
                    const result = UserSession.login(username, password);
                    if (result.success) {
                        window.location.href = '../profile/index.html';
                    } else {
                        errorMsg.textContent = result.message;
                    }
                } else {
                    const result = UserSession.signup(username, password);
                    if (result.success) {
                        window.location.href = '../profile/index.html';
                    } else {
                        errorMsg.textContent = result.message;
                    }
                }
            });
        });
    </script>
</body>

</html>
