<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-91RR8YFMZ6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-91RR8YFMZ6');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xyphers - Play</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1><a href="../" class="home-link">
                    <svg class="logo-x" viewBox="0 0 100 100">
                        <circle cx="30" cy="30" r="21" />
                        <line x1="56" y1="56" x2="90" y2="90" />
                        <line x1="90" y1="10" x2="10" y2="90" />
                    </svg>YPHERS
                </a></h1>
            <div id="timer" class="timer">00:00</div>
            <div class="controls">
                <button id="new-game-btn" class="btn primary">New Game</button>
                <button id="clear-btn" class="btn secondary">Clear</button>
                <button id="check-btn" class="btn secondary">Check</button>
                <div id="auth-link-container" style="display:inline-block; margin-left:1rem;"></div>
            </div>
        </header>

        <div class="game-content">
            <main id="game-board" class="game-board">
                <!-- Cipher letters and inputs will be injected here -->
                <div class="loading-state">Initializing...</div>
            </main>

            <aside class="sidebar">
                <div class="panel options-panel">
                    <h3>SETTINGS</h3>
                    <div class="control-group">
                        <label for="cipher-type">Cipher Type</label>
                        <select id="cipher-type" class="full-width-select">
                            <option value="aristocrat">Aristocrat</option>
                            <option value="patristocrat">Patristocrat</option>
                            <option value="atbash">Atbash</option>
                            <option value="baconian">Baconian</option>
                        </select>
                    </div>
                    <div class="toggle-control">
                        <label for="toggle-highlight">Highlight Matches</label>
                        <input type="checkbox" id="toggle-highlight" checked>
                    </div>
                    <div class="toggle-control">
                        <label for="toggle-autofill">Autofill Letters</label>
                        <input type="checkbox" id="toggle-autofill" checked>
                    </div>
                    <div class="toggle-control">
                        <label for="toggle-theme">Dark Mode</label>
                        <input type="checkbox" id="toggle-theme">
                    </div>
                </div>

                <div class="panel freq-panel">
                    <h3>FREQUENCY</h3>
                    <div id="freq-chart" class="freq-chart">
                        <!-- Bars injected via JS -->
                    </div>
                </div>
            </aside>
        </div>

        <div id="status-message" class="status-message hidden">
            <!-- Win/Loss messages -->
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-btn">&times;</button>
            <h2>DECIPHERED</h2>
            <p id="win-author">ENCRYPTION DECODED SUCCESSFULLY</p>
            <div class="stat-box">
                <span class="stat-label">TIME</span>
                <span id="final-time" class="stat-value">01:24</span>
            </div>
            <button id="modal-next-btn" class="btn primary full-width">Next Cipher (Enter)</button>
        </div>
    </div>

    <footer class="app-footer">
        <p>Quotes provided by <a href="https://dummyjson.com/" target="_blank">DummyJSON API</a></p>
    </footer>

    <script src="../theme.js"></script>
    <script src="../auth.js"></script>
    <script src="quotes.js"></script>
    <script src="script.js"></script>
</body>

</html>
