<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Xyphers</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../play/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="../auth.js"></script>
    <script src="../theme.js"></script>
    <style>
        body {
            justify-content: center;
            align-items: center;
        }

        .settings-container {
            max-width: 600px;
            width: 100%;
            padding: 3rem;
        }

        .settings-panel {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid var(--input-border);
            width: calc(100% - 2rem);
            max-width: 600px;
            margin: 2rem;
            box-shadow: var(--shadow-lg), 0 20px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        .settings-panel h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .settings-panel p {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--input-border);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .setting-info p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
            text-align: left;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="settings-container">
        <div class="settings-panel">
            <h1>⚙️ Settings</h1>
            <p>Customize your Xyphers experience</p>

            <div class="setting-item">
                <div class="setting-info">
                    <h3>Dark Mode</h3>
                    <p>Switch between light and dark themes</p>
                </div>
                <!-- Checkbox Checked = Dark Mode -->
                <input type="checkbox" id="toggle-theme">
            </div>
        </div>

        <a href="../play/" class="back-link">← Back to Game</a>
    </div>

    <script>
        // Initialize theme toggle
        const themeToggle = document.getElementById('toggle-theme');

        // Ensure theme is initialized
        ThemeManager.init();

        // Initial state: if theme is dark, checkbox should be checked
        themeToggle.checked = ThemeManager.getCurrentTheme() === 'dark';

        themeToggle.addEventListener('change', () => {
            ThemeManager.setTheme(themeToggle.checked ? 'dark' : 'light');
        });
    </script>
</body>

</html>
