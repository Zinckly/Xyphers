<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Coming Soon - Xyphers</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../play/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="../theme.js"></script>
    <style>
        body {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .coming-soon-container {
            max-width: 600px;
            padding: 3rem;
        }

        .coming-soon-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent-primary);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: var(--shadow-md);
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="coming-soon-container">
            <div class="coming-soon-icon">🏆</div>
            <h1>Leaderboard</h1>
            <p>Compete with players worldwide and climb the ranks! Global leaderboards are currently under development.
            </p>
            <a href="../play/" class="back-link">Play Single-player</a>
        </div>
    </div>
</body>

</html>
